# ==============================================
# CLINIC SPA BACKEND - Configuration
# ==============================================

spring.application.name=SiraShopBackend

# ==============================================
# MySQL Database Configuration (WampServer)
# ==============================================
# 1. Creer la base "sirashop_db" sur phpMyAdmin
# 2. Spring Boot + Hibernate cree les tables automatiquement
# ==============================================
spring.datasource.url=jdbc:mysql://localhost:3306/sirashop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================
# JPA / Hibernate
# ==============================================
# ddl-auto=update : cree/met a jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================
# Server Configuration
# ==============================================
server.port=8081

# ==============================================
# JWT Configuration (a configurer plus tard)
